name:
  hdfs
services:
  namenode:
    image: docker.io/apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - ./exchange:/exchange
      - ./data/namenode:/opt/hadoop/data/nameNode
      - ./config:/opt/hadoop/etc/hadoop
      - ./scripts/start-namenode.sh:/run.sh
    ports:
      - "9870:9870"
      - "9000:9000"
      - "9866:9866"
    command: [ "/bin/bash", "/run.sh" ]
    restart: always
    networks:
      fake_network:
        ipv4_address: 172.42.0.2
  datanode1:
    image: docker.io/apache/hadoop:3.4.1
    container_name: datanode1
    hostname: datanode1
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - ./data/datanode1:/opt/hadoop/data/dataNode
      - ./config:/opt/hadoop/etc/hadoop
      - ./scripts/start-datanode.sh:/run.sh
    ports:
      - "9864:9864"
    depends_on:
      - namenode
    command: [ "/bin/bash", "/run.sh" ]
    restart: always
    networks:
      fake_network:
        ipv4_address: 172.42.0.3
  datanode2:
    image: docker.io/apache/hadoop:3.4.1
    container_name: datanode2
    hostname: datanode2
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - ./data/datanode2:/opt/hadoop/data/dataNode
      - ./config:/opt/hadoop/etc/hadoop
      - ./scripts/start-datanode.sh:/run.sh
    ports:
      - "9865:9864"
    depends_on:
      - namenode
    command: [ "/bin/bash", "/run.sh" ]
    restart: always
    networks:
      fake_network:
        ipv4_address: 172.42.0.4
networks:
  fake_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.42.0.0/16
